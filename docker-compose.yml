version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: edf_hackathon_db
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U edf_user -d edf_track" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
